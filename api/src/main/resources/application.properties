spring.application.name=forma3d-api

# Banco: valores locais como padrao, sobreponiveis por variavel de ambiente na publicacao.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forma3d}
spring.datasource.username=${DB_USER:forma3d}
spring.datasource.password=${DB_PASSWORD:forma3d}

# O schema e responsabilidade do Flyway; o Hibernate so confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Enderecos da interface autorizados a chamar a API (separar por virgula).
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

server.port=${PORT:8080}

# --- Autenticacao (dia 3) ---
# Segredo de assinatura do token. Em producao vem de variavel de ambiente e tem
# no minimo 32 caracteres. O valor local abaixo serve so para desenvolvimento.
app.jwt.segredo=${JWT_SEGREDO:desenvolvimento-forma3d-segredo-local-nao-usar-em-producao}
app.jwt.emissor=forma3d-api
app.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:12}

# Usuario unico do painel. Criado na inicializacao se ainda nao existir.
# Em producao, defina ADMIN_EMAIL e ADMIN_SENHA por variavel de ambiente.
app.admin.email=${ADMIN_EMAIL:admin@forma3d.com.br}
app.admin.senha=${ADMIN_SENHA:forma3d-troque-em-producao}

# --- Armazenamento de imagem: Cloudinary (dia 3) ---
# Pegue a CLOUDINARY_URL no painel da Cloudinary (formato cloudinary://chave:segredo@nuvem)
# e exporte como variavel de ambiente. Sem ela, a rota de upload responde 503.
cloudinary.url=${CLOUDINARY_URL:}
app.upload.pasta=${UPLOAD_PASTA:forma3d/produtos}

# Limite de tamanho do arquivo enviado ao servidor.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
